<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — IVA Grupo GDM High Consulting México</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    /* Botones de acción alineados y con icono */
    .acciones { display:flex; gap:.35rem; justify-content:flex-end; flex-wrap:wrap; align-items:center; }
    .acciones a { text-decoration:none; }
    .bx { display:inline-flex; align-items:center; gap:.3rem; border:none; border-radius:7px;
          padding:.42rem .62rem; font-size:.8rem; font-weight:600; color:#fff; cursor:pointer;
          white-space:nowrap; line-height:1; }
    .bx:hover { filter:brightness(1.08); }
    .bx-editar   { background:#2563eb; }
    .bx-toggle   { background:#f59e0b; }
    .bx-eliminar { background:#dc2626; }
    .bx-pagar    { background:#16a34a; }
    .bx-nopagar  { background:#b91c1c; }
    /* Interruptor de Excel */
    .switch-excel { display:inline-flex; align-items:center; gap:.35rem; font-size:.78rem;
                    font-weight:600; color:#334155; cursor:pointer; user-select:none; }
    .switch-excel input { width:16px; height:16px; cursor:pointer; accent-color:#16a34a; }
    @media(max-width:760px){ .acciones { justify-content:center; } }
  </style>
</head>
<body>

<nav class="navbar">
  <span class="marca" style="line-height:1.1">IVA — Administrador<br><span style="font-size:.7rem;font-weight:500;opacity:.85">Grupo GDM High Consulting México</span></span>
  <div style="display:flex;gap:1rem;align-items:center">
    <a href="/admin/logout">Cerrar sesión</a>
  </div>
</nav>

<div class="admin-wrap">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;gap:.6rem;flex-wrap:wrap">
    <h2>Clientes registrados</h2>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap">
      <button class="bx bx-eliminar" id="btnEliminarSel" onclick="eliminarSeleccionados()" disabled style="opacity:.5">🗑️ Eliminar seleccionados</button>
      <a href="/admin/leads.csv"><button class="bx" style="background:#0ea5e9">⬇ Exportar leads (CSV)</button></a>
      <a href="/admin/usuarios/nuevo"><button class="btn-nuevo">+ Nuevo cliente</button></a>
    </div>
  </div>

  <div id="msgOk" class="alerta alerta-info" style="display:none"></div>
  <div id="msgErr" class="alerta" style="display:none"></div>

  <div class="card">
    <table id="tablaUsuarios" style="width:100%;font-size:.88rem">
      <thead>
        <tr>
          <th style="width:28px;text-align:center"><input type="checkbox" id="chkTodos" title="Marcar todos" onchange="marcarTodos(this.checked)"></th>
          <th style="padding:.5rem">Nombre</th>
          <th>Usuario</th>
          <th>RFC</th>
          <th>Estado</th>
          <th style="text-align:center">Créditos</th>
          <th style="text-align:center">Excel</th>
          <th>Alta</th>
          <th style="text-align:center">Acciones</th>
        </tr>
      </thead>
      <tbody id="bodyUsuarios">
        <tr><td colspan="9" style="padding:2rem;text-align:center;color:#94a3b8">Cargando...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
if (params.get('ok')) {
  const msgs = { nuevo:'Cliente creado exitosamente.', editado:'Cliente actualizado.', eliminado:'Cliente eliminado.' };
  const el = document.getElementById('msgOk');
  el.textContent = msgs[params.get('ok')] || 'Operación exitosa.';
  el.style.display = 'block';
}

// ─── Sesión expirada ──────────────────────────────────────────────────────────
// Si la sesión del admin caducó, el servidor contesta a cualquier acción con un
// 302 al login; el fetch lo sigue y regresa la página de login (200), así que la
// acción "no hace nada" en silencio. Esto lo detecta y manda a entrar de nuevo,
// en vez de dejar al admin picando botones que no responden.
function sesionExpiro(r) {
  return r.redirected || /\/admin\/login/.test(r.url) || r.status === 401 || r.status === 403;
}
async function accionAdmin(url, opts) {
  const r = await fetch(url, opts);
  if (sesionExpiro(r)) {
    alert('Tu sesión de administrador expiró. Entra de nuevo.');
    window.location.href = '/admin/login';
    throw new Error('sesion-expirada');
  }
  return r;
}

async function cargarUsuarios() {
  let data;
  try {
    const res = await accionAdmin('/admin/api/usuarios');
    data = await res.json();
  } catch (e) { return; }   // sesión expirada → ya se redirigió al login
  window._usuarios = data;
  const tbody = document.getElementById('bodyUsuarios');

  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="9" style="padding:2rem;text-align:center;color:#94a3b8">No hay clientes registrados.</td></tr>';
    return;
  }

  tbody.innerHTML = data.map(u => `
    <tr>
      <td style="text-align:center"><input type="checkbox" class="chk-cli" value="${u.id}" onchange="actualizarSel()"></td>
      <td style="padding:.45rem .5rem">${u.nombre}${u.empresa ? `<br><span style="font-size:.74rem;color:#64748b">${u.empresa}</span>` : ''}</td>
      <td>${u.username}${u.telefono ? `<br><span style="font-size:.74rem;color:#64748b">${u.telefono}</span>` : ''}</td>
      <td><code>${u.rfc}</code></td>
      <td>${estadoBadge(u)}</td>
      <td style="text-align:center;font-weight:600;${(u.creditos||0) > 0 ? 'color:#0369a1' : 'color:#94a3b8'}">${u.creditos || 0}</td>
      <td style="text-align:center">
        <label class="switch-excel" title="Habilitar la descarga a Excel (servicio de pago)">
          <input type="checkbox" ${u.excel_habilitado ? 'checked' : ''} onchange="toggleExcel(${u.id}, this)">
          Excel
        </label>
      </td>
      <td>${u.created_at ? u.created_at.substring(0,10) : ''}</td>
      <td>
        <div class="acciones">
          <button class="bx" style="background:#0369a1" title="Acreditar créditos y abrir NEXO → Facturación → IVA para emitir la factura" onclick="acreditarCreditos(${u.id})">＋ Créditos</button>
          ${u.origen === 'AUTOREGISTRO' && u.estado === 'ACTIVO' ? `<button class="bx bx-nopagar" title="Marcar no pagado: bloquea el acceso" onclick="bloquearUsuario(${u.id})">🚫 No pagado</button>` : ''}
          <a href="/admin/usuarios/${u.id}/editar"><button class="bx bx-editar" title="Editar cliente">✏️ Editar</button></a>
          <button class="bx bx-toggle" title="${u.activo ? 'Desactivar' : 'Activar'} cliente" onclick="toggleUsuario(${u.id}, this)">${u.activo ? '⏸️ Desactivar' : '▶️ Activar'}</button>
        </div>
      </td>
    </tr>
  `).join('');
}

// Badge del estado comercial — mismo orden que estadoAcceso del backend:
// cliente GDM · anualidad vigente · prueba con consultas · créditos prepago · bloqueo.
function estadoBadge(u) {
  if (!u.activo) return '<span class="badge badge-inactivo">Inactivo</span>';
  if (u.origen === 'ADMIN') return '<span class="badge badge-activo">Cliente GDM</span>';
  if (u.estado === 'ACTIVO' && u.vigencia_fin) {
    const dias = Math.ceil((new Date(u.vigencia_fin + 'T23:59:59') - new Date()) / 86400000);
    if (dias > 0) return `<span class="badge badge-activo">Activo · ${dias} días</span>`;
  } else if (u.estado === 'ACTIVO') {
    return '<span class="badge badge-activo">Activo</span>';
  }
  if (u.estado === 'PRUEBA') {
    const rest = Math.max(0, (u.pruebas_max || 2) - (u.pruebas_usadas || 0));
    if (rest > 0) return `<span class="badge" style="background:#fef3c7;color:#92400e">Prueba (${rest}/${u.pruebas_max || 2})</span>`;
  }
  if ((u.creditos || 0) > 0) return `<span class="badge" style="background:#e0f2fe;color:#0369a1">Créditos (${u.creditos})</span>`;
  if (u.estado === 'BLOQUEADO') return '<span class="badge" style="background:#fee2e2;color:#b91c1c">Bloqueado</span>';
  if (u.estado === 'PRUEBA') return '<span class="badge" style="background:#fee2e2;color:#b91c1c">Prueba agotada</span>';
  if (u.estado === 'ACTIVO') return '<span class="badge" style="background:#fee2e2;color:#b91c1c">Vencido</span>';
  return '<span class="badge badge-inactivo">—</span>';
}

async function toggleUsuario(id, btn) {
  try { await accionAdmin(`/admin/usuarios/${id}/toggle`, { method: 'POST' }); cargarUsuarios(); }
  catch (e) {}
}

// Casillas: «Eliminar seleccionados» borra los clientes marcados (por fetch,
// así una sesión expirada avisa en vez de no hacer nada).
function seleccionados() { return [...document.querySelectorAll('.chk-cli:checked')].map((c) => parseInt(c.value, 10)); }
function actualizarSel() {
  const n = seleccionados().length, btn = document.getElementById('btnEliminarSel');
  btn.disabled = n === 0; btn.style.opacity = n ? '1' : '.5';
  btn.textContent = n ? `🗑️ Eliminar seleccionados (${n})` : '🗑️ Eliminar seleccionados';
}
function marcarTodos(on) { document.querySelectorAll('.chk-cli').forEach((c) => { c.checked = on; }); actualizarSel(); }
async function eliminarSeleccionados() {
  const ids = seleccionados();
  if (!ids.length) return;
  if (!confirm(`¿Eliminar ${ids.length} cliente(s)?\nSe borrarán sus archivos de e-firma (salvo los que comparta otra cuenta del mismo RFC).`)) return;
  try {
    const r = await accionAdmin('/admin/usuarios/eliminar-lote', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ ids }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) alert(j.error || ('Algunos no se pudieron eliminar:\n' + (j.errores || []).join('\n')));
    document.getElementById('chkTodos').checked = false;
    await cargarUsuarios();
    actualizarSel();
  } catch (e) {}
}

async function pagarUsuario(id) {
  if (!confirm('¿Confirmar pago y activar 365 días de acceso para este cliente?')) return;
  try {
    const r = await accionAdmin(`/admin/usuarios/${id}/pagar`, { method: 'POST' });
    if (r.ok) { cargarUsuarios(); } else { alert('No se pudo marcar como pagado.'); }
  } catch (e) {}
}

async function bloquearUsuario(id) {
  if (!confirm('¿Marcar como NO pagado y bloquear el acceso de este cliente?')) return;
  try {
    const r = await accionAdmin(`/admin/usuarios/${id}/bloquear`, { method: 'POST' });
    if (r.ok) { cargarUsuarios(); } else { alert('No se pudo bloquear.'); }
  } catch (e) {}
}

// «+ Créditos»: (opcional) acredita el paquete aquí y luego manda al cliente a
// NEXO → Súper Admin → Facturación → «IVA (servicio)», donde se elige la emisora y
// se emite la factura. Si dejas vacía la captura, sólo lo envía a NEXO.
async function acreditarCreditos(id) {
  const u = (window._usuarios || []).find((x) => x.id === id) || {};
  const nombre = u.nombre || '', origen = u.origen;
  const nexo = window.open('about:blank', '_blank');   // se abre en el clic (si no, el bloqueador de ventanas lo frena)
  // Pago de la ANUALIDAD: activa 365 días (vence el mismo día del año siguiente) y
  // NEXO lo pasa a «Usuarios reales» con alta = hoy y próximo cobro = esa fecha.
  const anual = confirm(`¿"${nombre}" pagó la ANUALIDAD ($500 + IVA)?\n\nAceptar = activa 1 año + Excel y lo pasa a «Usuarios reales» en NEXO con su próximo cobro.\nCancelar = sólo créditos / ir a facturar.`);
  if (anual) {
    try {
      const r = await accionAdmin(`/admin/usuarios/${id}/pagar`, { method: 'POST' });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) { alert('No se pudo registrar el pago.'); if (nexo) nexo.close(); return; }
      if (!(j.nexo && j.nexo.ok)) alert(`Pago registrado (vence ${j.vigencia_fin}), pero NEXO no lo recibió: ${(j.nexo && j.nexo.error) || 'sin respuesta'}`);
      if (nexo) nexo.location = j.url || 'https://hcgm.com.mx/erp/admin/facturacion?panel=IVA';
      cargarUsuarios();
    } catch (e) { if (nexo) nexo.close(); }
    return;
  }
  const txt = origen === 'ADMIN' ? '' : prompt(`Créditos (consultas) a acreditar a "${nombre}" (p. ej. 5, 20, 50).\nDeja vacío para sólo ir a facturar en NEXO:`, '');
  const creditos = parseInt(txt || '', 10);
  try {
    if (creditos > 0) {
      const monto = parseFloat(prompt('Monto del pago recibido (MXN, sin IVA):', '') || '0') || 0;
      const r = await accionAdmin(`/admin/usuarios/${id}/creditos`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ creditos, monto, metodo: 'TRANSFERENCIA', concepto: `Paquete de ${creditos} consultas` }),
      });
      if (!r.ok) { const e = await r.json().catch(() => ({})); alert(e.error || 'No se pudo acreditar.'); }
    }
    const s2 = await accionAdmin(`/admin/usuarios/${id}/nexo`, { method: 'POST' });
    const j = await s2.json().catch(() => ({}));
    if (!j.ok) alert('Aviso: ' + (j.error || 'no se pudo enviar el cliente a NEXO') + '\nAbro NEXO de todos modos.');
    if (nexo) nexo.location = j.url || 'https://hcgm.com.mx/erp/admin/facturacion?panel=IVA';
    cargarUsuarios();
  } catch (e) { if (nexo) nexo.close(); }
}

// Habilita/deshabilita la descarga a Excel (servicio de pago) con el checkbox.
async function toggleExcel(id, el) {
  const on = el.checked;
  try {
    const r = await accionAdmin(`/admin/usuarios/${id}/excel?excel=${on}`, { method: 'POST' });
    if (!r.ok) { el.checked = !on; alert('No se pudo cambiar el permiso de Excel.'); return; }
    cargarUsuarios();
  } catch (e) { el.checked = !on; }
}

cargarUsuarios();
</script>
</body>
</html>
