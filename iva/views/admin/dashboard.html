<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — IVA Grupo GDM High Consulting México</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<nav class="navbar">
  <span class="marca" style="line-height:1.1">IVA — Administrador<br><span style="font-size:.7rem;font-weight:500;opacity:.85">Grupo GDM High Consulting México</span></span>
  <div style="display:flex;gap:1rem;align-items:center">
    <a href="/admin/logout">Cerrar sesión</a>
  </div>
</nav>

<div class="admin-wrap">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
    <h2>Clientes registrados</h2>
    <a href="/admin/usuarios/nuevo"><button class="btn-nuevo">+ Nuevo cliente</button></a>
  </div>

  <div id="msgOk" class="alerta alerta-info" style="display:none"></div>
  <div id="msgErr" class="alerta" style="display:none"></div>

  <div class="card">
    <table id="tablaUsuarios" style="width:100%;font-size:.88rem">
      <thead>
        <tr>
          <th style="padding:.5rem">Nombre</th>
          <th>Usuario</th>
          <th>RFC</th>
          <th>Estado</th>
          <th>Alta</th>
          <th style="text-align:center">Acciones</th>
        </tr>
      </thead>
      <tbody id="bodyUsuarios">
        <tr><td colspan="6" style="padding:2rem;text-align:center;color:#94a3b8">Cargando...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
if (params.get('ok')) {
  const msgs = { nuevo:'Cliente creado exitosamente.', editado:'Cliente actualizado.', eliminado:'Cliente eliminado.' };
  const el = document.getElementById('msgOk');
  el.textContent = msgs[params.get('ok')] || 'Operación exitosa.';
  el.style.display = 'block';
}

async function cargarUsuarios() {
  const res  = await fetch('/admin/api/usuarios');
  const data = await res.json();
  const tbody = document.getElementById('bodyUsuarios');

  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="6" style="padding:2rem;text-align:center;color:#94a3b8">No hay clientes registrados.</td></tr>';
    return;
  }

  tbody.innerHTML = data.map(u => `
    <tr>
      <td style="padding:.45rem .5rem">${u.nombre}</td>
      <td>${u.username}</td>
      <td><code>${u.rfc}</code></td>
      <td>${estadoBadge(u)}</td>
      <td>${u.created_at ? u.created_at.substring(0,10) : ''}</td>
      <td style="text-align:center;display:flex;gap:.4rem;justify-content:center;flex-wrap:wrap">
        ${u.origen === 'AUTOREGISTRO' ? `<button class="btn-sm" style="background:#16a34a;color:#fff;border:none" onclick="pagarUsuario(${u.id})">Marcar pagado</button>` : ''}
        ${u.origen === 'AUTOREGISTRO' && u.estado === 'ACTIVO' ? `<button class="btn-sm" style="background:#dc2626;color:#fff;border:none" onclick="bloquearUsuario(${u.id})">Marcar no pagado</button>` : ''}
        <a href="/admin/usuarios/${u.id}/editar"><button class="btn-sm btn-editar">Editar</button></a>
        <button class="btn-sm btn-toggle" onclick="toggleUsuario(${u.id}, this)">${u.activo ? 'Desactivar' : 'Activar'}</button>
        <button class="btn-sm btn-eliminar" onclick="eliminarUsuario(${u.id}, '${u.nombre}')">Eliminar</button>
      </td>
    </tr>
  `).join('');
}

// Badge del estado comercial (clientes GDM vs prueba/activo/bloqueado).
function estadoBadge(u) {
  if (!u.activo) return '<span class="badge badge-inactivo">Inactivo</span>';
  if (u.origen === 'ADMIN') return '<span class="badge badge-activo">Cliente GDM</span>';
  if (u.estado === 'PRUEBA') {
    const rest = Math.max(0, (u.pruebas_max || 2) - (u.pruebas_usadas || 0));
    return `<span class="badge" style="background:#fef3c7;color:#92400e">Prueba (${rest}/${u.pruebas_max || 2})</span>`;
  }
  if (u.estado === 'BLOQUEADO') return '<span class="badge" style="background:#fee2e2;color:#b91c1c">Bloqueado</span>';
  if (u.estado === 'ACTIVO') {
    if (u.vigencia_fin) {
      const dias = Math.ceil((new Date(u.vigencia_fin + 'T23:59:59') - new Date()) / 86400000);
      return `<span class="badge badge-activo">Activo · ${dias > 0 ? dias + ' días' : 'vencido'}</span>`;
    }
    return '<span class="badge badge-activo">Activo</span>';
  }
  return '<span class="badge badge-inactivo">—</span>';
}

async function toggleUsuario(id, btn) {
  await fetch(`/admin/usuarios/${id}/toggle`, { method: 'POST' });
  cargarUsuarios();
}

async function eliminarUsuario(id, nombre) {
  if (!confirm(`¿Eliminar al cliente "${nombre}"?\nSe borrarán sus archivos de e-firma.`)) return;
  const form = document.createElement('form');
  form.method = 'POST';
  form.action = `/admin/usuarios/${id}/eliminar`;
  document.body.appendChild(form);
  form.submit();
}

async function pagarUsuario(id) {
  if (!confirm('¿Confirmar pago y activar 365 días de acceso para este cliente?')) return;
  const r = await fetch(`/admin/usuarios/${id}/pagar`, { method: 'POST' });
  if (r.ok) { cargarUsuarios(); } else { alert('No se pudo marcar como pagado.'); }
}

async function bloquearUsuario(id) {
  if (!confirm('¿Marcar como NO pagado y bloquear el acceso de este cliente?')) return;
  const r = await fetch(`/admin/usuarios/${id}/bloquear`, { method: 'POST' });
  if (r.ok) { cargarUsuarios(); } else { alert('No se pudo bloquear.'); }
}

cargarUsuarios();
</script>
</body>
</html>
