<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IVA — Administrador GDM</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1 style="font-size:1.25rem;line-height:1.2">IVA<br><span style="font-size:.9rem;font-weight:600;color:#475569">Grupo GDM High Consulting México</span></h1>
    <p class="subtitulo">Panel de Administrador</p>

    <div id="alerta" class="alerta" style="display:none">Usuario o contraseña incorrectos.</div>

    <form method="POST" action="/admin/login">
      <label for="username">Usuario</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>

      <button type="submit" class="btn-primary">Ingresar</button>
    </form>
  </div>
</div>
<script>
  // Admin: error normal (interno), no redirige a página de WhatsApp
  if (new URLSearchParams(window.location.search).get('error') === '1')
    document.getElementById('alerta').style.display = 'block';
</script>
</body>
</html>
