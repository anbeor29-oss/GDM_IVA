<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cambiar Contraseña — Admin</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>Cambiar Contraseña</h1>
    <p class="subtitulo">Es tu primer acceso. Establece una nueva contraseña.</p>

    <div id="alerta" class="alerta" style="display:none">
      Las contraseñas no coinciden o son demasiado cortas (mínimo 8 caracteres).
    </div>

    <form method="POST" action="/admin/cambiar-password">
      <label for="nueva">Nueva contraseña</label>
      <input type="password" id="nueva" name="nueva" minlength="8" required autofocus>

      <label for="confirma">Confirmar contraseña</label>
      <input type="password" id="confirma" name="confirma" minlength="8" required>

      <button type="submit" class="btn-primary">Guardar contraseña</button>
    </form>
  </div>
</div>
<script>
  if (new URLSearchParams(window.location.search).get('error') === '1')
    document.getElementById('alerta').style.display = 'block';
</script>
</body>
</html>
