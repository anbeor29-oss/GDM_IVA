<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Continúa con tu suscripción — IVA Grupo GDM High Consulting México</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Segoe UI",Arial,sans-serif; background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1rem; color:#1f2937; }
    .card { background:#fff; border-radius:16px; width:100%; max-width:540px; padding:2.4rem 2.2rem; text-align:center; box-shadow:0 25px 50px -12px rgba(0,0,0,.45); }
    .ic { font-size:3rem; }
    h1 { font-size:1.45rem; margin:.3rem 0 .2rem; color:#0f172a; }
    .sub { color:#475569; margin-bottom:1.3rem; }
    .oferta { background:#ecfdf5; border:1px solid #a7f3d0; border-radius:12px; padding:1.1rem 1.2rem; text-align:left; margin-bottom:1.3rem; line-height:1.6; color:#065f46; }
    .oferta strong { color:#047857; }
    .precio { font-size:1.5rem; font-weight:800; color:#047857; }
    .btn-whatsapp { display:inline-flex; align-items:center; justify-content:center; gap:.6rem; background:#25d366; color:#fff; padding:1rem 2rem; border-radius:50px; text-decoration:none; font-weight:700; font-size:1.05rem; box-shadow:0 10px 25px -5px rgba(37,211,102,.5); }
    .btn-whatsapp:hover { filter:brightness(1.03); }
    .numero { color:#16a34a; font-weight:700; font-size:1.1rem; margin:.4rem 0; }
    .salir { display:block; margin-top:1.6rem; color:#64748b; text-decoration:none; font-size:.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="ic">🔒</div>
    <h1 id="titulo">Tu prueba terminó</h1>
    <p class="sub" id="detalle">Para seguir consultando tu IVA, activa tu suscripción anual.</p>

    <div class="oferta">
      <strong>Consulta de IVA — Grupo GDM</strong><br>
      Todas las consultas que necesites, con <b>descarga a Excel</b>, por:
      <div class="precio">$500 + IVA / año</div>
      Al confirmar tu pago, se activan <b>365 días</b> de acceso.
    </div>

    <div class="numero">📱 443 367 7027</div>
    <a class="btn-whatsapp"
       href="https://wa.me/524433677027?text=Hola%2C%20quiero%20activar%20mi%20suscripci%C3%B3n%20anual%20de%20consulta%20de%20IVA%20(Grupo%20GDM)."

      Activar por WhatsApp
    </a>

    <a class="salir" href="/logout">Cerrar sesión</a>
  </div>
  <script>
    fetch('/dashboard/api/estado-cuenta').then(r => r.ok ? r.json() : null).then(d => {
      if (!d) return;
      if (d.motivo === 'vencido') {
        document.getElementById('titulo').textContent = 'Tu suscripción venció';
        document.getElementById('detalle').textContent = 'Renueva tu suscripción anual para seguir consultando tu IVA.';
      } else if (d.motivo === 'prueba-agotada' || d.motivo === 'bloqueado') {
        document.getElementById('titulo').textContent = 'Usaste tus 2 consultas de prueba';
        document.getElementById('detalle').textContent = 'Activa tu suscripción anual para seguir consultando tu IVA.';
      }
    }).catch(() => {});
  </script>
</body>
</html>
