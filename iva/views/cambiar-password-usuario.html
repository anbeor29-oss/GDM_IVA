<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cambiar contraseña — IVA Grupo GDM High Consulting México</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Segoe UI",Arial,sans-serif; background:linear-gradient(135deg,#1e3a5f 0%,#2563eb 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1rem; color:#1f2937; }
    .card { background:#fff; border-radius:16px; width:100%; max-width:440px; padding:2.2rem 2rem; box-shadow:0 25px 50px -12px rgba(0,0,0,.4); }
    h1 { font-size:1.3rem; margin:0 0 .3rem; color:#0f172a; text-align:center; }
    .sub { color:#475569; text-align:center; margin-bottom:1.5rem; font-size:.92rem; }
    label { display:block; font-size:.82rem; font-weight:600; color:#334155; margin:0 0 .35rem; }
    input { width:100%; padding:.7rem .8rem; border:1px solid #cbd5e1; border-radius:9px; font-size:.95rem; margin-bottom:1rem; }
    input:focus { outline:none; border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,.15); }
    .btn { width:100%; border:none; border-radius:10px; padding:.9rem; color:#fff; font-size:1rem; font-weight:700; cursor:pointer; background:#2563eb; }
    .btn:hover { filter:brightness(1.05); }
    .alerta { background:#fef2f2; border:1px solid #fecaca; color:#b91c1c; padding:.7rem .9rem; border-radius:9px; font-size:.88rem; margin-bottom:1rem; display:none; }
    .hint { font-size:.78rem; color:#64748b; margin:-.6rem 0 1.2rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔒 Cambia tu contraseña</h1>
    <p class="sub">Es tu primer acceso: define una contraseña propia para continuar.</p>
    <div id="alerta" class="alerta"></div>
    <form method="POST" action="/cambiar-password">
      <label>Nueva contraseña</label>
      <input type="password" name="nueva" minlength="8" required autofocus>
      <label>Confirmar contraseña</label>
      <input type="password" name="confirma" minlength="8" required>
      <p class="hint">Mínimo 8 caracteres.</p>
      <button type="submit" class="btn">Guardar y continuar</button>
    </form>
  </div>
  <script>
    if (new URLSearchParams(location.search).get('error')) {
      const a = document.getElementById('alerta');
      a.textContent = 'Las contraseñas no coinciden o tienen menos de 8 caracteres.';
      a.style.display = 'block';
    }
  </script>
</body>
</html>
