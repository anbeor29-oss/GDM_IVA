<!DOCTYPE html>
<html lang="es">
<head>

  <title>Acceso exclusivo — IVA Grupo GDM High Consulting México</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .denegado-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      padding: 1rem;
    }
    .denegado-card {
      background: #fff;
      border-radius: 16px;
      padding: 3rem 2.5rem;
      max-width: 540px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.4);
    }
    .denegado-card h1 {
      color: #0f172a;
      font-size: 1.6rem;
      margin: 0 0 .5rem;
      line-height: 1.3;
    }
    .denegado-card .marca {
      color: #475569;
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 2rem;
    }
    .icono {
      font-size: 3.5rem;
      margin-bottom: 1rem;
    }
    .mensaje-principal {
      background: #fef3c7;
      border-left: 4px solid #f59e0b;
      padding: 1.25rem;
      border-radius: 8px;
      margin: 1.5rem 0;
      text-align: left;
      color: #78350f;
      line-height: 1.6;
    }
    .mensaje-principal strong {
      color: #92400e;
      display: block;
      margin-bottom: .5rem;
      font-size: 1.05rem;
    }
    .btn-whatsapp {
      display: inline-flex;
      align-items: center;

      gap: .6rem;
      background: #25d366;
      color: #fff;
      padding: 1rem 2rem;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.1rem;
      box-shadow: 0 10px 25px -5px rgba(37, 211, 102, 0.5);
      transition: transform 0.15s, box-shadow 0.15s;
      margin-top: .5rem;
    }
    .btn-whatsapp:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px -5px rgba(37, 211, 102, 0.6);
    }
    .btn-whatsapp svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }
    .numero {
      color: #16a34a;
      font-weight: 700;
      font-size: 1.15rem;
      margin: 1rem 0 .25rem;
    }
    .volver {
      display: block;
      margin-top: 2rem;
      color: #64748b;
      text-decoration: none;
      font-size: .9rem;
    }
    .volver:hover { color: #1e40af; }
